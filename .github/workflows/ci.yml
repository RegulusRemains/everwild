name: Check playable game

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run game tests
        run: npm test
      - name: Package playable game
        run: npm run build
      - name: Upload playable ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: everwild-playable
          path: dist/
          include-hidden-files: true
          if-no-files-found: error

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tooling
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Exercise the playable game in Chromium
        run: node tests/browser-smoke.cjs
