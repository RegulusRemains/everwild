<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111e1b">
  <meta name="description" content="Everwild: a solo fantasy sandbox. Explore Willowmere, summon an elemental, and venture into the crypt.">
  <title>Everwild — Willowmere Frontier</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2315231f'/%3E%3Cpath d='M16 4 7 18h6L6 26h8v4h4v-4h8l-7-8h6Z' fill='%23c9b278'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="shell" aria-label="Everwild game">
    <section id="scene" class="scene" aria-label="Game world">
      <canvas id="game" tabindex="0" aria-label="Willowmere game world. WASD or arrows move. Space selects an enemy. I opens inventory; Escape opens the game menu."></canvas>
      <div class="hud" aria-label="Game HUD">
        <section class="vitals hud-frame" aria-label="Character health and mana">
          <button class="character-tag" data-dialog="character" title="Character [V]"><span class="character-sigil" aria-hidden="true">✧</span><span>Wayfarer</span><span id="level">Lv. 1</span></button>
          <div class="resource health-resource"><span>HP</span><div class="meter health"><i id="hpbar"></i><span id="hptext"></span></div></div>
          <div class="resource mana-resource"><span>MP</span><div class="meter mana"><i id="mpbar"></i><span id="mptext"></span></div></div>
        </section>
        <section id="pet-frame" class="pet-frame hud-frame" aria-label="Companion" hidden>
          <div class="pet-line"><span id="pet-type">Earth</span><span id="pet-order">Guard</span></div>
          <div class="meter pet-health"><i id="petbar"></i></div>
        </section>
        <section id="target-card" class="target-card" aria-label="Selected target" hidden>
          <div class="target-heading"><span id="target-con" aria-hidden="true"></span><strong id="target-name"></strong><span id="target-level"></span></div>
          <div class="meter health"><i id="target-hp"></i></div>
          <div class="target-foot"><span id="target-percent"></span><span id="threat-label"></span></div>
          <div id="enemy-intent" hidden><div class="intent-line"><strong id="enemy-intent-name"></strong></div><div class="meter warning"><i id="enemy-intent-bar"></i></div></div>
        </section>
        <nav class="hud-nav" aria-label="Game shortcuts"><button type="button" class="icon-button" data-dialog="inventory" aria-label="Inventory [I]" title="Inventory [I]"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M7 9h18l2 19H5L7 9Z"/><path d="M11 9V6a5 5 0 0 1 10 0v3M11 17h10M12 23h8"/></svg><kbd>I</kbd></button><button type="button" class="icon-button" data-dialog="spellbook" aria-label="Spellbook [B]" title="Spellbook [B]"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="m16 3 3 8 9 5-9 3-3 10-4-10-9-3 9-5 4-8Z"/><path d="m5 3 1 3 3 1M26 25l1 3 3 1"/></svg><kbd>B</kbd></button><button type="button" class="icon-button" data-dialog="journal" aria-label="Journal [J]" title="Journal [J]"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 5h10c3 0 4 2 4 4v19c-1-2-3-3-6-3H5V5Zm22 0h-5c-2 0-3 2-3 4M27 5v20h-4M9 11h5M9 16h5"/></svg><kbd>J</kbd></button><button type="button" class="icon-button" data-dialog="map" id="map-toggle" aria-label="Map [M]" title="Map [M]"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="m3 7 9-3 9 4 8-3v22l-8 3-9-4-9 3V7Zm9-3v22M21 8v22"/><path d="m6 17 3-3 7 5 8-5"/></svg><kbd>M</kbd></button><button type="button" class="icon-button" data-dialog="system" id="pause" aria-label="Game menu [Esc]" title="Game menu [Esc]"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 8h22M5 16h22M5 24h22"/></svg><kbd>Esc</kbd></button></nav>
        <div id="interaction-hint" class="interaction-hint" hidden></div>
        <div id="toast" role="status" aria-live="polite" hidden></div>
        <div id="discovery" class="discovery" role="status" aria-live="polite" hidden></div>
        <section class="action-deck" aria-label="Actions">
          <div id="cast-readout" class="cast-row" hidden><div class="cast-label"><span id="cast-status"></span><span id="cast-time"></span></div><div class="cast-meter"><i id="cast-progress"></i></div></div>
          <div class="utility-row">
            <div class="commands" aria-label="Companion and recovery commands">
              <button id="attack" title="Pet attack [F]"><kbd>F</kbd><span>Attack</span></button>
              <button id="follow" title="Pet follow [G]"><kbd>G</kbd><span>Follow</span></button>
              <button id="guard" title="Pet guard [C]"><kbd>C</kbd><span>Guard</span></button>
              <button id="taunt" title="Pet taunt [Q]"><kbd>Q</kbd><span>Taunt</span></button>
              <button id="rest" title="Meditate [R]"><kbd>R</kbd><span>Rest</span></button>
              <button id="interact" title="Interact [E]"><kbd>E</kbd><span>Interact</span></button>
            </div>
            <div class="quick-supplies" aria-label="Tonics">
              <button id="health-tonic" title="Health tonic [Z]" aria-label="Health tonic [Z]"><span class="atlas-icon extra-arcana health-art" aria-hidden="true"></span><kbd>Z</kbd><b id="health-count">2</b></button>
              <button id="mana-tonic" title="Mana tonic [X]" aria-label="Mana tonic [X]"><span class="atlas-icon extra-arcana mana-art" aria-hidden="true"></span><kbd>X</kbd><b id="mana-count">1</b></button><span id="supply-cooldown"></span>
            </div>
          </div>
          <div id="actionbar" class="actionbar" aria-label="Spells"></div>
        </section>
      </div>
      <div id="paused-overlay" class="veil" hidden><div><span class="eyebrow">PAUSED</span><h2>The wilds can wait.</h2><button class="primary" id="resume">Resume</button></div></div>
      <div id="death-overlay" class="veil" hidden><div><span class="eyebrow">YOU HAVE FALLEN</span><h2>A thread unbroken.</h2><p>Your belongings and level are safe. Future victories repay experience debt.</p><button class="primary" id="revive">Return to the bindstone</button></div></div>
      <noscript><div class="veil"><p>Everwild needs JavaScript enabled to play.</p></div></noscript>
    </section>
  </main>
  <dialog id="menu-dialog" aria-labelledby="dialog-title"><div class="dialog-top"><div><span id="dialog-eyebrow" class="eyebrow">EVERWILD</span><h2 id="dialog-title"></h2></div><button id="dialog-close" aria-label="Close menu">✕</button></div><div id="dialog-content"></div><div class="dialog-footer"><span>World paused</span><span><kbd>Esc</kbd> return</span></div></dialog>
  <input id="import-file" type="file" accept="application/json,.json" hidden>
  <script src="src/engine.js"></script>
  <script src="src/render.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
